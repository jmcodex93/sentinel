name: Verify Sentinel
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests -q
      - name: Verify distributed license
        run: python -c "from pathlib import Path; assert Path('LICENSE').read_bytes() == Path('plugin/LICENSE').read_bytes()"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Ensure committed frontend matches source
        run: |
          git diff --exit-code -- ../plugin/web
          test -z "$(git ls-files --others --exclude-standard ../plugin/web)"
